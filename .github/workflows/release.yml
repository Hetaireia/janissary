name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check tag matches package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match pyproject v$v"; exit 1; }
      - name: Install build
        run: python -m pip install build --user
      - name: Build sdist and wheel
        run: python -m build
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/janissary
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-dockerhub:
    name: Publish to Docker Hub
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: oraclemode337/janissary
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tag matches package version
        run: |
          v=$(grep -m1 ^version pyproject.toml | tr -dc 0-9.)
          [ "$v" = "${TAG#v}" ] || { echo "tag ${TAG#v} does not match pyproject $v"; exit 1; }
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: docker build -t "$IMAGE:${TAG#v}" -t "$IMAGE:latest" .
      - name: Verify the image reports the tag version
        run: |
          got=$(docker run --rm --entrypoint python "$IMAGE:${TAG#v}" -c "import janissary;print(janissary.__version__)")
          [ "$got" = "${TAG#v}" ] || { echo "image reports $got, tag ${TAG#v}"; exit 1; }
      - name: Push versioned tag
        run: docker push "$IMAGE:${TAG#v}"
      - name: Push latest
        run: docker push "$IMAGE:latest"
