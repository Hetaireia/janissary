# Pre-commit hooks for JANISSARY — all local, no network fetch required.
# Install: pip install -e ".[dev]" && pre-commit install && pre-commit install --hook-type pre-push
# Run manually: pre-commit run --all-files
#               pre-commit run --hook-stage pre-push --all-files
#
# Rule 1 (amended in session-0.3.5): whole-tree gate at two stages.
#   commit -> ruff (check --fix, format, check, format --check)
#   push   -> pytest (full suite)
# All hooks use language: system and resolve binaries from PATH.
# Requirement: run git commit / git push from an activated venv.
# Remote `repo:`-style hooks are intentionally absent — GitHub clones hang
# on first fetch in this environment.
# Ruff version pinning is enforced by pyproject.toml.
#
# Escape hatch (explicit, not silent): SKIP=pytest-full git push ...

default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: ruff check --fix (whole tree)
        entry: ruff
        args: [check, --fix, .]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (whole tree)
        entry: ruff
        args: [format, .]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-check-verify
        name: ruff check (verify)
        entry: ruff
        args: [check, .]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format-verify
        name: ruff format --check (verify)
        entry: ruff
        args: [format, --check, .]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest-full
        name: pytest -q (full suite)
        entry: pytest
        args: [-q]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]