[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janissary"
version = "7.1.0"
description = "Automated offensive security platform for small teams"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Hetaireia", email = "hetaireia.it@gmail.com" }]
keywords = ["security", "dast", "pentest", "scanner", "vulnerability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "websockets>=12.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
browser = ["playwright>=1.40"]
ml = ["scikit-learn>=1.3", "numpy>=1.26"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
janissary = "janissary.cli:main"

[project.urls]
Homepage = "https://github.com/Hetaireia/janissary"
Documentation = "https://github.com/Hetaireia/janissary/tree/main/docs"
Issues = "https://github.com/Hetaireia/janissary/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"