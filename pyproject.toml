[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janissary"
version = "7.1.0"
description = "Automated offensive security platform for small teams"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Hetaireia", email = "hetaireia.it@gmail.com" }]
keywords = ["security", "dast", "pentest", "scanner", "vulnerability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "websockets>=12.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
browser = ["playwright>=1.40"]
ml = ["scikit-learn>=1.3", "numpy>=1.26"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
janissary = "janissary.cli:main"

[project.urls]
Homepage = "https://github.com/Hetaireia/janissary"
Documentation = "https://github.com/Hetaireia/janissary/tree/main/docs"
Issues = "https://github.com/Hetaireia/janissary/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "ANN101", "ANN102", "ANN204", "ANN401"]

[tool.mypy]
python_version = "3.10"
# Strict mode is the aspiration. The codebase was ported incrementally
# from a single-file prototype; typing is tightened module-by-module.
# New modules must be strict-clean before merge.
strict = false
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"


# Per-module overrides for the modules ported from the v7.0 prototype.
# These modules carry residual type mismatches that are being fixed
# incrementally. Each override names the specific error codes to
# silence, so the rest of mypy's checks still apply within these
# modules. Remove an entry once its module is clean.
[[tool.mypy.overrides]]
module = [
    "janissary.recon.pacer",
    "janissary.recon.waf",
    "janissary.agent.finding_store",
    "janissary.engine.scanner",
    "janissary.cli",
]
disable_error_code = [
    "assignment",
    "arg-type",
    "union-attr",
    "attr-defined",
    "override",
    "no-any-return",
]
