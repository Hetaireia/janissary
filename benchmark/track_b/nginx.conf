# Minimal reverse proxy. Cloudflare terminates TLS for the public hostname;
# this listener speaks plain HTTP on port 8080 and forwards to Juice Shop.
#
# Client IP is forwarded so operator-side analysis can see what Cloudflare
# already logged. Do not add rate limits or request filtering here - the
# benchmark measures Cloudflare's behaviour, not the origin's.

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://juice-shop:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}